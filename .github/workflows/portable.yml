name: Build Portable Release

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'python/**'
      - 'scripts/portable/**'
      - '.github/workflows/portable.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install and Build Frontend
        working-directory: frontend
        run: |
          npm install --no-audit --no-fund --legacy-peer-deps
          npm run build

      - name: Extract meta
        id: meta
        run: |
          SHA_SHORT=$(git rev-parse --short HEAD)
          COMMIT_MSG=$(git log -1 --pretty=%s)
          VER=$(echo "$COMMIT_MSG" | grep -oE '^V[0-9][a-z0-9-]*' | head -1 || true)
          if [ -z "$VER" ]; then
            VER=$(echo "$COMMIT_MSG" | grep -oE '^v[0-9][a-zA-Z0-9-]*' | head -1 || true)
          fi
          if [ -z "$VER" ]; then VER="build"; fi
          DATE=$(date +%Y%m%d-%H%M)
          TAG="portable-${VER}-${SHA_SHORT}"
          echo "sha_short=${SHA_SHORT}" >> $GITHUB_OUTPUT
          echo "date=${DATE}" >> $GITHUB_OUTPUT
          echo "ver=${VER}" >> $GITHUB_OUTPUT
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "commit_msg=${COMMIT_MSG}" >> $GITHUB_OUTPUT

      - name: Assemble Portable Package
        run: |
          set -e
          PKG_NAME="air-counselor-workbench-portable-${{ steps.meta.outputs.ver }}"
          rm -rf "$PKG_NAME"
          mkdir -p "$PKG_NAME"

          # 后端代码（剔除缓存/数据库/日志）
          rsync -a --exclude='__pycache__' --exclude='*.pyc' --exclude='*.log' \
                --exclude='data/*.db' --exclude='data/*.db-journal' \
                backend "$PKG_NAME/"

          # 前端构建产物
          mkdir -p "$PKG_NAME/frontend"
          cp -r frontend/dist "$PKG_NAME/frontend/dist"

          # V6.20: 嵌入式 Python 运行时
          if [ -d "python" ] && [ -f "python/python.exe" ]; then
            echo "使用仓库内 python/ 运行时"
            cp -r python "$PKG_NAME/python"
          else
            echo "仓库未携带 python/，下载官方嵌入式 Python 3.11"
            mkdir -p "$PKG_NAME/python"
            curl -sL "https://www.python.org/ftp/python/3.11.9/python-3.11.9-embed-amd64.zip" -o /tmp/pyembed.zip
            unzip -q /tmp/pyembed.zip -d "$PKG_NAME/python"
          fi

          # 覆盖 _pth 指向 backend 和 site-packages
          cp scripts/portable/python311._pth "$PKG_NAME/python/python311._pth"

          # 启动脚本和修复脚本（从仓库复制，避免 YAML heredoc 问题）
          cp scripts/portable/启动.bat "$PKG_NAME/启动.bat"
          cp scripts/portable/修复依赖.bat "$PKG_NAME/修复依赖.bat"

          # requirements.txt
          cp backend/requirements.txt "$PKG_NAME/requirements.txt"

          # README
          cp scripts/portable/README-便携版.md "$PKG_NAME/README-便携版.md" || true

          # 自检
          echo "=== 包内关键文件自检 ==="
          test -f "$PKG_NAME/python/python.exe" && echo "[OK] python/python.exe" || echo "[FAIL] python/python.exe"
          test -f "$PKG_NAME/backend/main.py" && echo "[OK] backend/main.py" || echo "[FAIL] main.py"
          test -f "$PKG_NAME/frontend/dist/index.html" && echo "[OK] frontend/dist/index.html" || echo "[FAIL] index.html"
          test -d "$PKG_NAME/backend/Lib/site-packages/fastapi" && echo "[OK] fastapi 依赖" || echo "[FAIL] fastapi"
          grep -q "DEPLOY_RUN_PORT=8000" "$PKG_NAME/启动.bat" && echo "[OK] 端口 8000" || echo "[FAIL] 端口"
          grep -q 'python.exe' "$PKG_NAME/启动.bat" && echo "[OK] 使用内置 Python" || echo "[FAIL] Python"

          zip -rq "${PKG_NAME}.zip" "$PKG_NAME"
          ls -lh *.zip
          echo "PKG_FILE=${PKG_NAME}.zip" >> $GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: "便携版 · ${{ steps.meta.outputs.ver }} · ${{ steps.meta.outputs.sha_short }}"
          body: |
            ## 辅导员工作平台便携版 · ${{ steps.meta.outputs.ver }}

            **本波 commit**: `${{ steps.meta.outputs.sha_short }}` — ${{ steps.meta.outputs.commit_msg }}

            **构建时间**: ${{ steps.meta.outputs.date }} (北京)

            ---

            ## V6.20 修复内容

            - 📦 **便携包真正开箱即用**：内置 Python 运行时 + 全部依赖，无需单独安装 Python，双击启动.bat 即可运行
            - 🔌 **端口统一为 8000**：修复历史版本启动脚本引导 8000、程序实际监听 5000 导致打不开的问题
            - 🤖 **AI 开关真正生效**：关闭 AI 功能后，Dashboard 预警卡片和 AI 预警页面同步停止，不再"关了还在跑"
            - 📅 **校历同步增强**：使用 Session 保持会话，秋季/春季学期切换均已实测通过
            - 📄 **文档工具箱**：预览/下载/重命名/移动分类/删除完整可用，下载文件名保留正确扩展名

            ## 使用方法

            1. 下载下方 zip，**完整解压**到任意目录
            2. 双击 `启动.bat`
            3. 浏览器自动打开 http://127.0.0.1:8000

            > 已内置 Python 3.11 + 全部依赖，无需安装任何环境。Windows 10/11 64 位。

            由 GitHub Actions 自动构建。
          files: ${{ env.PKG_FILE }}
          draft: false
          prerelease: false
          make_latest: 'true'
