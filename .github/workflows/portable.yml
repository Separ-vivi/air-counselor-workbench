name: Build Portable Release

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'python/**'
      - 'scripts/portable/**'
      - '.github/workflows/portable.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install and Build Frontend
        working-directory: frontend
        run: |
          npm install --no-audit --no-fund --legacy-peer-deps
          npm run build

      - name: Extract meta
        id: meta
        run: |
          SHA_SHORT=$(git rev-parse --short HEAD)
          COMMIT_MSG=$(git log -1 --pretty=%s)
          VER=$(echo "$COMMIT_MSG" | grep -oE '^V[0-9][a-z0-9-]*' | head -1 || true)
          if [ -z "$VER" ]; then
            VER=$(echo "$COMMIT_MSG" | grep -oE '^v[0-9][a-zA-Z0-9-]*' | head -1 || true)
          fi
          if [ -z "$VER" ]; then VER="build"; fi
          DATE=$(date +%Y%m%d-%H%M)
          TAG="portable-${VER}-${SHA_SHORT}"
          echo "sha_short=${SHA_SHORT}" >> $GITHUB_OUTPUT
          echo "date=${DATE}" >> $GITHUB_OUTPUT
          echo "ver=${VER}" >> $GITHUB_OUTPUT
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "commit_msg=${COMMIT_MSG}" >> $GITHUB_OUTPUT

      - name: Assemble Portable Package
        run: |
          set -e
          PKG_NAME="air-counselor-workbench-portable-${{ steps.meta.outputs.ver }}"
          rm -rf "$PKG_NAME"
          mkdir -p "$PKG_NAME"

          # Backend (exclude caches/db/logs)
          rsync -a --exclude='__pycache__' --exclude='*.pyc' --exclude='*.log' \
                --exclude='data/*.db' --exclude='data/*.db-journal' \
                backend "$PKG_NAME/"

          # Frontend build
          mkdir -p "$PKG_NAME/frontend"
          cp -r frontend/dist "$PKG_NAME/frontend/dist"

          # Embedded Python runtime - always download full official version
          echo "Downloading official embedded Python 3.11.9..."
          mkdir -p "$PKG_NAME/python"
          curl -sL "https://www.python.org/ftp/python/3.11.9/python-3.11.9-embed-amd64.zip" -o /tmp/pyembed.zip
          unzip -q -o /tmp/pyembed.zip -d "$PKG_NAME/python"
          rm -f /tmp/pyembed.zip

          # Merge extra .pyd files from repo if present
          if [ -d "python" ]; then
            echo "Merging extra .pyd files from repo..."
            find python -name "*.pyd" -exec cp {} "$PKG_NAME/python/" \; 2>/dev/null || true
          fi

          # Override _pth to point at backend and site-packages
          cp scripts/portable/python311._pth "$PKG_NAME/python/python311._pth"

          # Launcher scripts (English filenames, pure ASCII to avoid encoding issues)
          cp scripts/portable/start.bat "$PKG_NAME/start.bat"
          cp scripts/portable/fix-deps.bat "$PKG_NAME/fix-deps.bat"

          # requirements.txt
          cp backend/requirements.txt "$PKG_NAME/requirements.txt"

          # README
          cp scripts/portable/README.txt "$PKG_NAME/README.txt" 2>/dev/null || true

          # Self-check
          echo "=== Package self-check ==="
          test -f "$PKG_NAME/python/python.exe" && echo "[OK] python/python.exe" || echo "[FAIL] python/python.exe"
          test -f "$PKG_NAME/python/python311.zip" && echo "[OK] python311.zip (stdlib)" || echo "[FAIL] python311.zip missing!"
          test -f "$PKG_NAME/backend/main.py" && echo "[OK] backend/main.py" || echo "[FAIL] main.py"
          test -f "$PKG_NAME/frontend/dist/index.html" && echo "[OK] frontend/dist/index.html" || echo "[FAIL] index.html"
          test -d "$PKG_NAME/backend/Lib/site-packages/fastapi" && echo "[OK] fastapi deps" || echo "[FAIL] fastapi"
          test -f "$PKG_NAME/start.bat" && echo "[OK] start.bat" || echo "[FAIL] start.bat"
          # Verify start.bat is pure ASCII
          if LC_ALL=C grep -qP '[^\x00-\x7F]' "$PKG_NAME/start.bat"; then
            echo "[FAIL] start.bat contains non-ASCII characters!"
            exit 1
          else
            echo "[OK] start.bat is pure ASCII (no encoding issues)"
          fi
          grep -q "DEPLOY_RUN_PORT=5000" "$PKG_NAME/start.bat" && echo "[OK] port 5000" || echo "[FAIL] port config"

          zip -rq "${PKG_NAME}.zip" "$PKG_NAME"
          ls -lh *.zip
          echo "PKG_FILE=${PKG_NAME}.zip" >> $GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: "Portable V8 - ${{ steps.meta.outputs.sha_short }}"
          body: |
            ## Counselor Workbench Portable - V8

            **Commit**: `${{ steps.meta.outputs.sha_short }}` - ${{ steps.meta.outputs.commit_msg }}

            **Build time**: ${{ steps.meta.outputs.date }} (Beijing)

            ---

            ### Fixes in this release (V8)

            - **校历同步修复**：便携版嵌入式 Python 缺少 `requests` 库导致"无法获取校历页面（No module named 'requests'）"；校历抓取全面改用 Python 标准库（urllib + cookiejar），零第三方依赖，cookie 会话 / POST 切换学期 / 重试 / 残缺页回退逻辑保持等价
            - **党团发展阶段修复**：共青团员（无党团发展记录时）不再被错误归一化显示为"群众"；班级 360 党团进度、学生 360 状态灯、学生列表导出党团列统一回退学生政治面貌字段；学生 360 党团 Tab 阶段选项补齐"共青团员"及下一步路径
            - 版本号升级为 V8（侧边栏 + 页面标题）

            ### How to use

            1. Download the zip below and **fully extract** it
            2. Double-click **`start.bat`**
            3. Browser opens automatically at http://127.0.0.1:5000

            > Includes Python 3.11 + all dependencies. No installation needed. Windows 10/11 64-bit.
            > If startup fails, run `fix-deps.bat` to repair dependencies.

            Built by GitHub Actions.
          files: ${{ env.PKG_FILE }}
          draft: false
          prerelease: false
          make_latest: 'true'
